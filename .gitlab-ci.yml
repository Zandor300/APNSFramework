image: composer:latest

stages:
  - lint
  - test
  - publish

cache:
  paths:
    - vendor/

before_script:
  - composer install

composer-validate:
  stage: lint
  script:
    - composer validate
  tags:
    - docker

php-lint:
  stage: lint
  script:
    - cd apnsframework
    - if find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \; | grep -v "No syntax errors detected"; then exit 1; fi
  tags:
    - docker

php-lint-examples:
  stage: lint
  script:
    - cd example
    - if find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \; | grep -v "No syntax errors detected"; then exit 1; fi
  tags:
    - docker
  allow_failure: true

phpunit:
  stage: test
  script:
    - ./vendor/bin/phpunit tests
  tags:
    - docker

publish:
  image: node:lts
  stage: publish
  before_script:
    # @iwavesmedia/semantic-release-composer runs `composer update --lock` whenever a composer.lock
    # is present, so the release needs a PHP and a Composer next to node. php-xml and php-mbstring
    # are required by the dev dependencies the lock file describes.
    - apt-get update
    - apt-get install -y --no-install-recommends php-cli php-xml php-mbstring
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - yarn install
  script:
    - yarn semantic-release
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /chore(release)$/
